name: Sayd

on:
  schedule:
    - cron: "17 * * * *"   # كل ساعة؛ البرنامج يقرر حسب config.toml هل يوجد فحص مستحق
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | full | hot | test (رسالة تجربة للتنبيهات)"
        default: auto
        type: choice
        options: [auto, full, hot, test]

permissions:
  contents: write

concurrency:
  group: sayd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # قاعدة البيانات في فرع db واللوحة في فرع data (Cloudflare يبني من data فقط).
      # كل فرع commit واحد يُستبدل كل مرة حتى لا يتضخم الريبو.
      - name: Load database
        run: |
          mkdir -p data
          for b in db data; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              git fetch --depth=1 origin "$b"
              if git archive FETCH_HEAD sayd.db | tar -x -C data; then echo "loaded from $b"; break; fi
            fi
          done

      - name: Run Sayd
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          case "$MODE" in
            full) python -m sayd --data data --force-full ;;
            hot)  python -m sayd --data data --force-hot ;;
            test) python -m sayd --test-notify ;;
            *)    python -m sayd --data data ;;
          esac

      - name: Publish database and dashboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {  # $1 = branch, $2 = folder
            (cd "$2" && git init -q -b "$1" \
              && git add -A \
              && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                 commit -q -m "$1 $(date -u +%Y-%m-%dT%H:%MZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$1")
          }
          if [ ! -f data/.changed ]; then echo "لا تغييرات للنشر"; exit 0; fi
          mkdir -p out/db && cp data/sayd.db out/db/
          publish db out/db
          if [ -f data/.publish_site ]; then
            mkdir -p out/site && cp -r data/site out/site/
            publish data out/site
          fi
