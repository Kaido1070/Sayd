name: Sayd

on:
  schedule:
    - cron: "17 * * * *"   # كل ساعة؛ البرنامج يقرر حسب config.toml هل يوجد فحص مستحق
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | full | hot | test (رسالة تجربة للتنبيهات) | restore (استعادة نسخة احتياطية)"
        default: auto
        type: choice
        options: [auto, full, hot, test, restore]
      backup:
        description: "اسم النسخة للاستعادة فقط، مثل sayd-2026-10-29.db.gz"
        required: false
        default: ""
# لا يوجد pull_request: كود طلبات السحب لا يشغّل هذا الـ workflow ولا يصل للأسرار

# لا صلاحيات افتراضية؛ المهمة تطلب ما تحتاجه فقط
permissions: {}

# تشغيل واحد في كل مرة. لا يُلغى تشغيل جارٍ (قد يكون يكتب البيانات)؛ الجديد ينتظر،
# وإذا تراكم أكثر من تشغيل منتظر يبقى أحدثها فقط
concurrency:
  group: sayd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04          # جهاز Linux قياسي (مجاني في المستودعات العامة)
    timeout-minutes: 90            # البوت يتوقف بهدوء عند 75 دقيقة (انظر --max-minutes) ويكمل لاحقاً
    permissions:
      contents: write              # فقط لدفع فرعي db و data
    env:
      MODE: ${{ inputs.mode || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # لا يبقى التوكن في .git/config أثناء تشغيل كود البوت

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip                   # كاش صغير لحزم pip فقط (ليس لبيانات البوت)
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # قاعدة البيانات في فرع db واللوحة في فرع data (Cloudflare يبني من data فقط).
      # كل فرع commit واحد يُستبدل كل مرة حتى لا يتضخم الريبو.
      - name: Load database
        if: env.MODE != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p data
          for b in db data; do
            if git ls-remote --exit-code --heads "$repo" "$b" >/dev/null; then
              git fetch -q --depth=1 "$repo" "$b"
              if git archive FETCH_HEAD sayd.db | tar -x -C data; then echo "loaded from $b"; break; fi
            fi
          done

      - name: Restore backup
        if: env.MODE == 'restore'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP: ${{ inputs.backup }}
        run: python -m sayd.backup restore --name "$BACKUP" --out data/sayd.db && date -u > data/.changed

      - name: Run Sayd
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          case "$MODE" in
            restore) echo "وضع الاستعادة: لا فحص" ;;
            full) python -m sayd --data data --max-minutes 75 --force-full ;;
            hot)  python -m sayd --data data --max-minutes 75 --force-hot ;;
            test) python -m sayd --test-notify ;;
            *)    python -m sayd --data data --max-minutes 75 ;;
          esac

      # يُنشر فقط إذا أنهى البوت عمله وتحقق من سلامة قاعدة البيانات (ملف .changed)؛
      # أي تشغيل انقطع في المنتصف لا يرفع نسخة ناقصة
      - name: Publish database and dashboard
        if: always() && env.MODE != 'test'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {  # $1 = branch, $2 = folder
            (cd "$2" && git init -q -b "$1" \
              && git add -A \
              && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                 commit -q -m "$1 $(date -u +%Y-%m-%dT%H:%MZ)" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$1")
          }
          if [ ! -f data/.changed ]; then echo "لا تغييرات للنشر"; exit 0; fi
          mkdir -p out/db && cp data/sayd.db out/db/
          cp data/coverage.json out/db/ 2>/dev/null || true   # تقرير التغطية الداخلي
          publish db out/db
          if [ -f data/.publish_site ]; then
            mkdir -p out/site && cp -r data/site out/site/
            publish data out/site
          fi

      # نسخة احتياطية يومية في GitHub Releases (آخر 14 يوماً + أول كل شهر دائماً)
      - name: Backup database
        if: always() && env.MODE != 'test'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/.changed ]; then exit 0; fi
          python -m sayd.backup save --db data/sayd.db
