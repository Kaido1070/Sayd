# إعدادات Sayd (غير سرية). التوكنات والمعرفات في GitHub Secrets فقط.

[site]
dashboard_url = "https://sayd.pages.dev"
include_marketplace = true    # منتجات البائعين الخارجيين
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

[scan]
delay_min = 1.0               # ثواني بين الطلبات
delay_max = 3.0
max_run_minutes = 300         # يتوقف بهدوء قبل حد GitHub (360) ويكمل لاحقاً
hot_every_minutes = 60        # مسح كل المنتجات التي عليها خصم أو عرض (~25 ألف، ~10 دقائق)
full_every_hours = 4          # مسح الكتالوج كامل + المنتجات التي لا تظهر في البحث (~25 دقيقة)
publish_every_minutes = 120   # تحديث اللوحة (كل نشر = بناء في Cloudflare؛ الحد المجاني 500/شهر)
pdp_per_run = 100             # صفحات منتجات تُفتح لكل تشغيل لاستخراج أكواد وعروض البنوك
price_check_per_run = 100     # صفحات منتجات اكسترا تُفتح بالتناوب للتأكد من السعر (البحث يتأخر أحياناً عن الصفحة)
pdp_recheck_hours = 48
sitemap_every_hours = 24      # تحديث قائمة صفحات المنتجات من خريطة الموقع
sitemap_mp_batch = 60         # صفحات بائعين خارجيين قديمة تُتحقق منها بالتدريج في كل مسح كامل
banner_pages = ["/ar-sa/", "/ar-sa/promotions"]

[deals]
# ما يظهر في الموقع افتراضياً، مقارنة بآخر سعر صالح رصده النظام (وليس السعر المشطوب في المتجر)
min_drop_pct = 10             # نزول 10% على الأقل...
min_saving = 30               # ...مع توفير 30 ريال على الأقل (الشرطان معاً)
big_saving = 200              # أو توفير 200 ريال فأكثر مهما كانت النسبة
max_age_days = 30             # نزول أقدم من هذا لا يُعرض كعرض حالي
enrich_per_run = 40           # صفحات منتجات العروض تُفتح لكل تشغيل (تأكيد السعر، الخيارات، البائع)

[alerts]
min_drop_pct = 10.0           # نزول عام
low_window_days = 30          # أقل سعر خلال هذه المدة
low_min_drop_pct = 10.0       # أقل نزول يُعتبر لشرط "أقل سعر خلال 30 يوم" (يمنع الإزعاج من فروق هللات)
strong_deal_pct = 60          # "عرض قوي": خصم 60% أو أكثر من السعر قبل الخصم — ينبه برجوع توفره لأي منتج
strong_restock_min_price = 100  # رجوع توفر "عرض قوي" لغير قائمة المراقبة: فقط للمنتجات بهذا السعر أو أكثر
strong_drop_pct = 40          # نزول 40% أو أكثر يُعلَّم كعرض قوي 🔥
max_individual = 60           # عدد الرسائل المنفصلة في التشغيل الواحد؛ الباقي يُجمع في رسالة ملخص
verify_max = 80               # أقصى عدد نزولات يُتحقق منها من صفحة المنتج قبل التنبيه
alert_bundle_offers = false   # عروض "اشترِ X ووفّر على Y"
min_price = 1                 # تجاهل الأسعار الأقل

# قائمة المراقبة: sku أو category (رمز القسم مثل "2-212" أو جزء من اسمه بالعربي)
# مع target_price (سعر مستهدف) و/أو drop_pct (نسبة خاصة). تنبيه رجوع التوفر يشمل كل عناصرها.
# [[watch]]
# sku = "100392608"
# target_price = 2800
#
# [[watch]]
# category = "2-212"
# drop_pct = 3

# بلايستيشن 5 بلو راي + كول اوف ديوتي مودرن وارفير 3 (وصل 765 بدل 2549 — ينبه إذا رجع متوفر)
[[watch]]
sku = "100353173"

# كل أجهزة بلايستيشن (نزول 10% أو أكثر + رجوع التوفر)
[[watch]]
category = "13-1304-1"
